<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-gray-100">
<div class="flex flex-col items-center justify-center h-screen px-4">
    <div class="w-full max-w-md">
        <img class="w-full mb-8" th:src="@{/images/logo-prefeitura.png}" alt="Logo da prefeitura">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Serviço Extraordinário</h2>
            <form th:action="@{/fiscal/login}" method="post" class="flex flex-col">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="flex flex-col w-full">
                    <label for="matricula" class="block text-sm font-semibold text-gray-700 mb-1">Matrícula</label>
                    <input type="text" name="matricula" id="matricula"
                           placeholder="Ex: 00000-0"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                </div>
                <div class="flex flex-col w-full">
                    <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
                    <input type="password" name="senha" id="senha"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
                </div>
                <p class="text-red-400 text-xs mt-1" th:if="${error}" th:text="${error}"></p>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 mt-6">Login</button>
                <div class="mt-4 text-center">
                    <a th:href="@{/recuperar-senha}" class="text-sm text-blue-600 hover:underline transition-colors">Esqueci minha senha</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
