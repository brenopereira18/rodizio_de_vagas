<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-slate-200">
<div class="flex flex-col items-center justify-center h-screen px-4">
    <div class="w-full max-w-md">
        <img class="w-full mb-8" th:src="@{/images/logo-prefeitura.png}" alt="Logo da prefeitura">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Login</h2>
            <form th:action="@{/fiscal/login}" method="post" class="flex flex-col">
                <input type="text" name="matricula" class="bg-gray-100 text-gray-900 border-0 rounded-md p-2 mb-4 focus:bg-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150" placeholder="Matrícula">
                <input type="password" name="senha" class="bg-gray-100 text-gray-900 border-0 rounded-md p-2 focus:bg-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150" placeholder="Senha">
                <p class="text-red-400 text-xs mt-1" th:if="${error}" th:text="${error}"></p>
                <div class="flex items-center justify-between flex-wrap mt-4">
                    <label for="remember-me" class="text-sm text-gray-900 cursor-pointer">
                        <input type="checkbox" id="remember-me" class="mr-2">
                        Lembre-se de mim
                    </label>
                </div>
                <button type="submit" class="bg-gradient-to-r from-indigo-500 to-blue-500 text-white font-bold py-2 px-4 rounded-md mt-4 hover:bg-indigo-600 hover:to-blue-600 transition ease-in-out duration-150">Login</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
