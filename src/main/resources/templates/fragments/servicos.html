<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body>
<div>

    <!-- Título e botão -->
    <div class="flex justify-between items-center mb-6 border-b-4 border-emerald-500 pb-2">
        <h1 class="text-2xl font-bold text-slate-700">
            <span th:if="${#lists.isEmpty(servicos)}">Nenhum serviço disponível no momento</span>
            <span th:if="${!#lists.isEmpty(servicos)}">Serviços disponíveis</span>
        </h1>
        <button
                type="button"
                onclick="document.getElementById('modal-servico').classList.remove('hidden')"
                class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded shadow"
        >
            + Novo Serviço
        </button>
    </div>

    <!-- Lista de serviços -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div th:each="servico : ${servicos}" class="bg-white p-4 rounded shadow">
            <h2 class="text-lg font-semibold text-slate-800" th:text="${servico.nome}">Nome do Serviço</h2>
            <p class="text-sm text-slate-600 mt-2" th:text="${servico.descricao}">Descrição do serviço.</p>
        </div>
    </div>

    <!-- Modal para criar novo serviço -->
    <div id="modal-servico" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
            <h2 class="text-xl font-bold mb-4">Novo Serviço</h2>
            <form th:action="@{/servicos/criar}" method="post" class="flex flex-col gap-4">
                <input type="text" name="titulo" placeholder="Título" required
                       class="border border-slate-300 rounded px-3 py-2 w-full" />
                <input type="text" name="local" placeholder="Local" required
                       class="border border-slate-300 rounded px-3 py-2 w-full" />
                <input type="datetime-local" name="data" placeholder="Data" required
                       class="border border-slate-300 rounded px-3 py-2 w-full" />
                <select name="supervisor" required
                        class="border border-slate-300 rounded px-3 py-2 w-full">
                    <option value="">Selecione um supervisor</option>
                    <option th:each="supervisor : ${supervisores}"
                            th:value="${supervisor.id}"
                            th:text="${supervisor.fullName}">
                    </option>
                </select>
                <select name="categoria" required
                        class="border border-slate-300 rounded px-3 py-2 w-full">
                    <option value="">Selecione uma categoria</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.name()}"
                            th:text="${categoria.category}">
                    </option>
                </select>
                <input type="number" name="numero-de-vagas" placeholder="Número de Vagas" required
                       class="border border-slate-300 rounded px-3 py-2 w-full" />

                <div class="flex justify-end gap-2">
                    <button type="button"
                            onclick="document.getElementById('modal-servico').classList.add('hidden')"
                            class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400 text-slate-700">
                        Cancelar
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded bg-emerald-500 hover:bg-emerald-600 text-white">
                        Criar
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
