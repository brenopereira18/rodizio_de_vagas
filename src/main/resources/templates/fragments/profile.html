<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<div>
    <div class="flex justify-between items-center mb-6 border-b-4 border-emerald-500 pb-2">
        <h1 class="text-lg md:text-2xl font-bold text-slate-700">
            Perfil
        </h1>
    </div>

    <div th:if="${success}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
        <span th:text="${error}"></span>
    </div>

    <div class="flex items-center justify-center mt-14">
        <div class="w-full max-w-2xl mx-auto bg-slate-200 p-6 rounded-2xl shadow-lg border border-slate-300 hover:shadow-xl duration-300 ease-in-out">

            <p class="text-sm md:text-base mb-2"><strong>Nome:</strong> <span th:text="${usuario.fullName()}"></span></p>
            <p class="text-sm md:text-base mb-2"><strong>Matrícula:</strong> <span th:text="${usuario.registration()}"></span></p>
            <p class="text-sm md:text-base mb-2"><strong>Telefone:</strong> <span th:text="${usuario.phoneNumber()}"></span></p>
            <p class="text-sm md:text-base mb-2"><strong>Função:</strong> <span th:text="${usuario.userRole().userRole}"></span></p>

            <div th:if="${usuario.userRole().name() == 'FISCAL'}" class="text-sm md:text-base mb-4">
                <p>Possui carteira de motorista?</p>
                <input type="hidden" name="haveALicense" value="false"/>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="haveALicense" value="true"
                           th:checked="${(updateDto.haveALicense() ?: false) == true}"
                           class="accent-emerald-500 w-5 h-5 rounded border border-gray-400 cursor-pointer opacity-100" disabled/>
                </label>
            </div>

            <div class="flex flex-col">
                <!-- Preferências do Fiscal -->
                <div th:if="${usuario.userRole().name() == 'FISCAL'}" class="mt-4 pb-8">
                    <h3 class="text-base md:text-lg mb-2">Preferências de Categoria</h3>
                    <div class="flex flex-col md:flex-row justify-between gap-2">
                        <label th:each="cat : ${categorias}" class="flex text-sm md:text-base items-center gap-1">
                            <input type="checkbox"
                                   th:checked="${#lists.contains(updateDto.getCategories(), cat)}"
                                   class="accent-emerald-500 w-5 h-5 rounded border border-gray-400 cursor-default opacity-100"
                                   disabled />
                            <span th:text="${cat.getCategory()}">Categoria</span>
                        </label>
                    </div>
                </div>

                <div class="text-xs md:text-base self-end lg:pt-0">
                    <!-- Botão para abrir o modal -->
                    <button onclick="document.getElementById('modal-atualizar').classList.remove('hidden')"
                            class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded">
                        Editar Dados
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-atualizar" class="fixed inset-0 flex items-center z-50 justify-center bg-black bg-opacity-50 hidden">
        <div class="bg-white p-6 rounded shadow w-full max-w-2xl mx-4">
            <h2 class="text-lg md:text-xl font-semibold mb-4">Atualizar Dados</h2>
            <form th:action="@{/gerenciador_de_servico/perfil/atualizar}" method="post" class="text-sm md:text-base mb-0">
                <input type="hidden" th:value="${usuario.registration()}" name="registration"/>
                <div class="mb-4">
                    <label class="block font-medium text-gray-700">Telefone</label>
                    <input type="text" name="phoneNumber" th:value="${updateDto.phoneNumber()}" class="w-full border border-gray-300 rounded px-3 py-2"/>
                </div>

                <div class="mb-4">
                    <label class="block font-medium text-gray-700">Nova Senha</label>
                    <input type="password" name="password" placeholder="Deixe em branco para não alterar"
                           class="w-full border border-gray-300 rounded px-3 py-2"/>
                </div>

                <div th:if="${usuario.userRole().name() == 'FISCAL'}" class="mb-4">
                    <input type="hidden" name="haveALicense" value="false"/>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="haveALicense" value="true"
                               th:checked="${updateDto.haveALicense() == true}"
                               class="accent-emerald-500 w-4 h-4"/>
                        <span class="font-medium text-gray-700">Possui carteira de motorista?</span>
                    </label>
                </div>

                <div th:if="${usuario.userRole().name() == 'FISCAL'}" class="mb-4">
                    <p class="font-medium text-gray-700 pb-2">Preferências</p>
                    <div class="flex flex-col md:flex-row justify-between gap-2">
                        <label th:each="cat : ${categorias}">
                            <input type="checkbox" name="categories" th:value="${cat}" th:checked="${#lists.contains(updateDto.getCategories(), cat)}" class="accent-emerald-500 w-4 h-4">
                            <span th:text="${cat.getCategory()}">Categoria</span>
                        </label>
                    </div>
                </div>

                <div class="flex text-xs md:text-base justify-end gap-2">
                    <button type="button" onclick="document.getElementById('modal-atualizar').classList.add('hidden')"
                            class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-500 text-white rounded">Salvar</button>
                </div>
            </form>
        </div>
    </div>

</div>
</html>
