<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body>
<div class="flex justify-between items-center mb-6 border-b-4 border-emerald-500 pb-2">
    <h1 class="text-lg md:text-2xl font-bold text-slate-700">
        <span th:if="${#lists.isEmpty(servicos)}">Nenhum serviço no momento</span>
        <span th:if="${!#lists.isEmpty(servicos)}">Serviços</span>
    </h1>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4">
    <div th:each="servico : ${servicos}"
         class="bg-slate-200 p-6 rounded-2xl shadow-lg border border-slate-300 hover:shadow-xl transition-shadow duration-300 ease-in-out">

        <h2 class="text-base md:text-lg font-semibold text-slate-800" th:text="${servico.title}">Nome do Serviço</h2>
        <p class="text-sm text-slate-600" th:text="'Local: ' + ${servico.location}"></p>
        <p class="text-sm text-slate-600"
           th:text="'Início: ' + ${#temporals.format(servico.serviceDate, 'dd/MM/yyyy  - HH:mm')}"></p>
        <p class="text-sm text-slate-600"
           th:text="'Término: ' + ${#temporals.format(servico.serviceEndDate, 'dd/MM/yyyy  - HH:mm')}"></p>
        <p class="text-sm text-slate-600" th:text="'Supervisor: ' + ${servico.managerName}"></p>
        <p class="text-sm text-slate-600" th:text="'Categoria: ' + ${servico.category.category}"></p>
        <p class="text-sm text-slate-600" th:text="'Número de vagas: ' + ${servico.numberOfVacancies}"></p>
        <!-- Exibir observação se existir -->
        <div th:if="${servico.observation != null}" class="mt-2">
            <p class="text-sm text-slate-600">
                <strong></strong> <span th:text="${servico.observation}" style="white-space: pre-wrap;"></span>
            </p>
        </div>

        <!-- Botão para mostrar/ocultar form -->
        <button type="button"
                class="mt-3 text-sm text-emerald-600 hover:underline"
                th:onclick="'document.getElementById(\'form-observacao-' + ${servico.id} + '\').classList.toggle(\'hidden\')'">
            Adicionar/Editar Observação
        </button>

        <!-- Formulário para enviar a observação -->
        <form th:id="'form-observacao-' + ${servico.id}"
              th:action="@{/inscricoes/servicos/{id}/observacao(id=${servico.id})}"
              method="post"
              class="hidden mt-2">
        <textarea name="observation"
                  rows="3"
                  class="w-full rounded border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 text-sm"
                  th:text="${servico.observation}"></textarea>
            <button type="submit"
                    class="mt-2 px-3 py-1 bg-emerald-600 text-white rounded hover:bg-emerald-700 text-sm">
                Salvar
            </button>
        </form>

        <div class="mt-4">
            <h3 class="font-semibold text-slate-800">Fiscais Inscritos:</h3>
            <ul>
                <li th:each="fiscal : ${servico.tax}">
                    <span class="text-sm text-emerald-700" th:text="${fiscal.fullName}"></span>
                </li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
