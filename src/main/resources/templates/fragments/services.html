<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::div})}">
<div>

    <!-- Título e botão -->
    <div class="flex justify-between items-center mb-6 border-b-4 border-emerald-500 pb-2">
        <h1 class="text-lg font-bold text-slate-700 md:text-2xl">
            <span th:if="${#lists.isEmpty(servicos)}">Nenhum serviço ativo</span>
            <span th:if="${!#lists.isEmpty(servicos)}"
                  th:text="${filtro == 'INSCRITOS'} ? 'Meus Serviços' : 'Serviços Ativos'">Serviços</span>
        </h1>
        <button th:if="${usuario.userRole.name() == 'ADMINISTRADOR'}" type="button"
                onclick="document.getElementById('modal-servico').classList.remove('hidden')"
                class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded shadow text-xs md:text-sm">
            + Novo Serviço
        </button>
    </div>

    <!-- Filtro -->
    <form method="get" th:action="@{/home/servicos/disponiveis}" class="mb-6">
        <label for="filter" class="text-sm font-medium text-slate-700 mr-2">Filtrar:</label>
        <select name="filter" id="filter" onchange="this.form.submit()"
                class="border border-slate-300 rounded px-2 py-1 text-sm">
            <option value="DISPONIVEIS" th:selected="${filtro == 'DISPONIVEIS'}">Disponíveis</option>
            <option th:if="${usuario.userRole.name() == 'FISCAL'}" value="INSCRITOS"
                    th:selected="${filtro == 'INSCRITOS'}">Inscritos
            </option>
            <option value="FREE" th:selected="${filtro == 'FREE'}">Serviços Abertos</option>
        </select>
    </form>

    <div th:if="${usuario.userRole.name() == 'FISCAL' && filtro == 'DISPONIVEIS' && freeServicesCount > 0}"
         class="mb-4 p-2 bg-blue-50 border-l-4 border-blue-400 rounded">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <img src="/images/atention.png" class="w-5 h-5">
            </div>
            <div class="ml-2 mr-2">
                <p class="text-sm text-blue-700">
                    <span th:text="${freeServicesCount == 1 ? 'Há 1 serviço aberto' : 'Há ' + freeServicesCount + ' serviços abertos'}"></span>
                    disponível para inscrição direta.
                    <a href="?filter=FREE" class="font-medium underline hover:text-blue-800 ml-1">Ver serviços abertos
                    </a>
                </p>
            </div>
            <div class="ml-auto flex items-center">
                <button onclick="this.parentElement.parentElement.parentElement.style.display='none'"
                        class="w-4 h-4 text-blue-400 hover:text-blue-600">
                    <img src="/images/close.svg" class="w-4 h-4">
                </button>
            </div>
        </div>
    </div>

    <!-- Lista de serviços -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4">
        <div th:each="servico : ${servicos}"
             class="bg-slate-200 p-6 rounded-2xl shadow-lg border border-slate-300 hover:shadow-xl transition-shadow duration-300 ease-in-out flex flex-col justify-between h-full">
            <h2 class="text-base md:text-lg font-semibold text-slate-800" th:text="${servico.work.title}">Nome do
                Serviço</h2>
            <p class="text-sm text-slate-600" th:text="'Local: ' + ${servico.work.location}"></p>
            <p class="text-sm text-slate-600"
               th:text="'Início: ' + ${#temporals.format(servico.work.serviceDate, 'dd/MM/yyyy  - HH:mm')}"></p>
            <p class="text-sm text-slate-600"
               th:text="'Término: ' + ${#temporals.format(servico.work.serviceEndDate, 'dd/MM/yyyy  - HH:mm')}"></p>
            <p class="text-sm text-slate-600" th:text="'Supervisor: ' + ${servico.work.manager.fullName}"></p>
            <p class="text-sm text-slate-600" th:text="'Categoria: ' + ${servico.work.category.category}"></p>
            <p class="text-sm text-slate-600" th:text="'Vagas: ' + ${servico.work.numberOfVacancies}"></p>

            <!-- Botões para Fiscal -->
            <div th:if="${usuario.userRole.name() == 'FISCAL'}" class="mt-4">

                <!-- Inscrever e Recusar (somente se fiscal tem prioridade e status for nulo ou WAITING) -->
                <div th:if="${servico.canApply}" class="flex gap-2 text-xs md:text-sm">
                    <form th:if="${servico.work.workStatus.name() == 'FREE'}"
                          th:action="@{'/inscricoes/servicos/free/inscrever/' + ${servico.work.id}}"
                          method="post">
                        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded">
                            Inscrever-se
                        </button>
                    </form>

                    <form th:if="${servico.work.workStatus.name() != 'FREE'}"
                          th:action="@{'/inscricoes/inscrever/' + ${servico.work.id}}"
                          method="post">
                        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded">
                            Inscrever-se
                        </button>
                    </form>

                    <form th:if="${servico.work.workStatus.name() != 'FREE'}"
                          th:action="@{'/inscricoes/recusar/' + ${servico.work.id}}" method="post">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                            Recusar
                        </button>
                    </form>
                </div>

                <!-- Mensagem para fiscais que ainda não têm prioridade -->
                <div th:if="${!servico.hasPriority and (servico.enrollment == null or servico.enrollment.subscriptionStatus.name() == 'WAITING')}"
                     class="text-sm text-yellow-700 mt-2">
                    Não está disponível para você no momento
                </div>

                <!-- Cancelar inscrição (se já estiver aceito) -->
                <div th:if="${servico.enrollment != null and servico.enrollment.subscriptionStatus.name() == 'ACCEPTED'}"
                     class="text-xs md:text-sm">
                    <form th:action="@{'/inscricoes/cancelar/' + ${servico.enrollment.id}}" method="post">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">
                            Cancelar inscrição
                        </button>
                    </form>
                </div>

                <!-- Se já recusou -->
                <div th:if="${servico.enrollment != null and servico.enrollment.subscriptionStatus.name() == 'REFUSED'}"
                     class="text-red-600 text-sm">
                    Você recusou este serviço
                </div>

            </div>

            <!-- Botões para Administrador -->
            <div th:if="${usuario.userRole.name() == 'ADMINISTRADOR'}" class="mt-4 flex gap-2 text-xs md:text-sm">
                <button
                        type="button"
                        class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded"
                        th:data-id="${servico.work.id}"
                        th:data-title="${servico.work.title}"
                        th:data-location="${servico.work.location}"
                        th:data-servicedate="${#temporals.format(servico.work.serviceDate, 'yyyy-MM-dd''T''HH:mm')}"
                        th:data-serviceenddate="${#temporals.format(servico.work.serviceEndDate, 'yyyy-MM-dd''T''HH:mm')}"
                        th:data-managerid="${servico.work.manager.id}"
                        th:data-category="${servico.work.category.name()}"
                        th:data-vacancies="${servico.work.numberOfVacancies}"
                        onclick="abrirModalEdicaoComDataset(this)">
                    Editar
                </button>

                <form th:action="@{/home/servicos/deletar}" method="post"
                      onsubmit="return confirm('Tem certeza que deseja excluir este serviço?');">
                    <input type="hidden" name="id" th:value="${servico.work.id}"/>
                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">Excluir
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal para criar novo serviço -->
    <div id="modal-servico" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mx-4">
            <h2 class="text-lg md:text-xl font-bold mb-4">Novo Serviço</h2>
            <form th:action="@{/home/servicos}" method="post" class="flex flex-col gap-4 text-sm">
                <input type="text" name="title" placeholder="Título" required
                       class="border border-slate-300 rounded px-2 py-1 w-full"/>
                <input type="text" name="location" placeholder="Local" required
                       class="border border-slate-300 rounded px-2 py-1 w-full"/>
                <div class="flex flex-col w-full">
                    <label for="serviceDate" class="text-sm text-slate-700 mb-1">Data e Hora de início</label>
                    <input type="datetime-local" name="serviceDate" id="serviceDate" required
                           class="border border-slate-300 rounded px-2 py-1 min-w-0"/>
                </div>
                <div class="flex flex-col w-full">
                    <label for="serviceEndDate" class="text-sm text-slate-700 mb-1">Data e Hora de término</label>
                    <input type="datetime-local" name="serviceEndDate" id="serviceEndDate" required
                           class="border border-slate-300 rounded px-2 py-1 w-full"/>
                </div>
                <select name="managerId" required class="border border-slate-300 rounded px-2 py-1 w-full">
                    <option value="">Selecione um supervisor</option>
                    <option th:each="supervisor : ${supervisores}"
                            th:value="${supervisor.id}"
                            th:text="${supervisor.fullName}"></option>
                </select>
                <select name="category" required class="border border-slate-300 rounded px-2 py-1 w-full">
                    <option value="">Selecione uma categoria</option>
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.name()}"
                            th:text="${categoria.category}"></option>
                </select>
                <input type="number" name="numberOfVacancies" placeholder="Número de Vagas" required
                       class="border border-slate-300 rounded px-2 py-1 w-full"/>

                <div class="flex justify-end gap-2 text-xs md:text-base">
                    <button type="button"
                            onclick="document.getElementById('modal-servico').classList.add('hidden')"
                            class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400 text-slate-700">Cancelar
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded bg-emerald-500 hover:bg-emerald-600 text-white">Criar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modal-editar-servico"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mx-4">
            <h2 class="text-lg md:text-xl font-bold mb-4">Editar Serviço</h2>
            <form id="form-editar-servico" th:action="@{/home/servicos/atualizar}" method="post"
                  class="flex flex-col gap-4">
                <input type="hidden" name="id" id="edit-id"/>
                <input type="text" name="title" id="edit-title" placeholder="Título" required
                       class="border border-slate-300 rounded px-2 py-1 w-full"/>
                <input type="text" name="location" id="edit-location" placeholder="Local" required
                       class="border border-slate-300 rounded px-2 py-1 w-full"/>
                <div class="flex flex-col w-full">
                    <label for="serviceDate" class="text-sm text-slate-700 mb-1">Data e Hora</label>
                    <input type="datetime-local" name="serviceDate" id="edit-serviceDate" placeholder="Data" required
                           class="border border-slate-300 rounded px-2 py-1 min-w-0"/>
                </div>
                <div class="flex flex-col w-full">
                    <label for="serviceEndDate" class="text-sm text-slate-700 mb-1">Data e Hora de término</label>
                    <input type="datetime-local" name="serviceEndDate" id="edit-serviceEndDate" required
                           class="border border-slate-300 rounded px-2 py-1 w-full"/>
                </div>
                <select name="managerId" id="edit-managerId" required
                        class="border border-slate-300 rounded px-2 py-1 w-full">
                    <option th:each="supervisor : ${supervisores}"
                            th:value="${supervisor.id}"
                            th:text="${supervisor.fullName}"></option>
                </select>
                <select name="category" id="edit-category" required
                        class="border border-slate-300 rounded px-2 py-1 w-full">
                    <option th:each="categoria : ${categorias}"
                            th:value="${categoria.name()}"
                            th:text="${categoria.category}"></option>
                </select>
                <input type="number" name="numberOfVacancies" id="edit-numberOfVacancies" placeholder="Número de Vagas"
                       required class="border border-slate-300 rounded px-2 py-1 w-full"/>

                <div class="flex justify-end gap-2 text-xs md:text-base">
                    <button type="button"
                            onclick="document.getElementById('modal-editar-servico').classList.add('hidden')"
                            class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400 text-slate-700">Cancelar
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded bg-emerald-500 hover:bg-emerald-600 text-white">Atualizar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function abrirModalEdicaoComDataset(button) {
            document.getElementById('edit-id').value = button.dataset.id;
            document.getElementById('edit-title').value = button.dataset.title;
            document.getElementById('edit-location').value = button.dataset.location;
            document.getElementById('edit-serviceDate').value = button.dataset.servicedate;
            document.getElementById('edit-serviceEndDate').value = button.dataset.serviceenddate;
            document.getElementById('edit-managerId').value = button.dataset.managerid;
            document.getElementById('edit-category').value = button.dataset.category;
            document.getElementById('edit-numberOfVacancies').value = button.dataset.vacancies;

            document.getElementById('modal-editar-servico').classList.remove('hidden');
        }
    </script>

</div>
</html>
