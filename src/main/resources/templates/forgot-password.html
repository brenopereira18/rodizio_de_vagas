<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-slate-200 flex items-center justify-center h-screen">
<div class="flex flex-col items-center justify-center min-h-screen px-4 py-8">
    <div class="w-full max-w-md">
        <img class="w-full mb-8" th:src="@{/images/logo-prefeitura.png}" alt="Logo da prefeitura">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Recuperar Senha</h2>

            <!-- Mensagens de Sucesso/Erro (comuns para ambos os formulários) -->
            <p class="text-green-600 text-xs mt-2" th:if="${success}" th:text="${success}"></p>
            <p class="text-red-400 text-xs mt-2" th:if="${error}" th:text="${error}"></p>
            <p class="text-gray-600 text-xs mt-2" th:if="${message}" th:text="${message}"></p>


            <!-- FORMULÁRIO 1: Solicitar Link (Exibido se NÃO houver token na URL) -->
            <div th:if="${!tokenPresent}">
                <p class="text-gray-700 mb-4">
                    Informe o número de telefone para receber um link de redefinição de senha.
                </p>
                <form th:action="@{/recuperar-senha}" method="post" class="flex flex-col">
                    <div class="flex flex-col w-full">
                        <label for="phoneNumber" class="text-sm text-slate-700">Número de telefone</label>
                        <input type="text" name="phoneNumber" id="phoneNumber"
                               placeholder="Ex: 32987654321" required
                               class="bg-gray-100 text-gray-900 border-0 rounded-md p-2 focus:bg-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150"/>
                    </div>
                    <button type="submit"
                            class="bg-gradient-to-r from-indigo-500 to-blue-500 text-white font-bold py-2 px-4 rounded-md mt-4 hover:bg-indigo-600 hover:to-blue-600 transition ease-in-out duration-150">
                        Enviar Link de Redefinição
                    </button>
                </form>
            </div>

            <!-- FORMULÁRIO 2: Definir Nova Senha (Exibido SE houver token na URL) -->
            <div th:if="${tokenPresent}">
                <p class="text-gray-700 mb-4">
                    Digite sua nova senha. Ela deve ter pelo menos 8 caracteres e incluir letras e números.
                </p>
                <!-- Use th:object para vincular ao DTO -->
                <form th:action="@{/resetar-senha}" th:object="${resetPasswordDTO}" method="post" class="flex flex-col">
                    <!-- O token precisa ser enviado com o formulário -->
                    <input type="hidden" th:field="*{token}"/> <!-- Usa th:field para vincular ao token do DTO -->

                    <div class="flex flex-col w-full">
                        <label for="newPassword" class="text-sm text-slate-700">Nova Senha</label>
                        <input type="password" th:field="*{newPassword}" id="newPassword" required
                               class="bg-gray-100 text-gray-900 border-0 rounded-md p-2 focus:bg-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150"/>
                        <!-- Exibe erros de validação para newPassword -->
                        <p class="text-red-400 text-xs mt-1" th:if="${#fields.hasErrors('newPassword')}"
                           th:errors="*{newPassword}"></p>
                    </div>
                    <div class="flex flex-col w-full">
                        <label for="confirmPassword" class="text-sm text-slate-700 mt-2">Confirmar Nova Senha</label>
                        <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required
                               class="bg-gray-100 text-gray-900 border-0 rounded-md p-2 focus:bg-gray-200 focus:outline-none focus:ring-1 focus:ring-blue-500 transition ease-in-out duration-150"/>
                        <!-- Exibe erros de validação para confirmPassword -->
                        <p class="text-red-400 text-xs mt-1" th:if="${#fields.hasErrors('confirmPassword')}"
                           th:errors="*{confirmPassword}"></p>
                    </div>
                    <button type="submit"
                            class="bg-gradient-to-r from-indigo-500 to-blue-500 text-white font-bold py-2 px-4 rounded-md mt-4 hover:bg-indigo-600 hover:to-blue-600 transition ease-in-out duration-150">
                        Redefinir Senha
                    </button>
                </form>
            </div>

            <div class="mt-4 text-center">
                <a th:href="@{/fiscal/login}" class="text-sm text-blue-600 hover:underline">Voltar para o Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
