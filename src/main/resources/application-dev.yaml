spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/gerenciador_de_vagas
        username: postgres
        password: 2001
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    data:
        redis:
            host: localhost
            port: 6379
            password: redis2001
            timeout: 5000
            ssl:
                enabled: false
    thymeleaf:
        cache: false
    devtools:
        restart:
            enabled: true
        livereload:
            enabled: true
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    base-url: https://dmfurb.pjf.mg.gov.br/servico_extraordinario

security:
    token:
        secret: GERENCIADOR_DE_VAGAS#

