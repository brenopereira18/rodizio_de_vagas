spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            timeout: 5000
            ssl:
                enabled: false
    devtools:
        restart:
            enabled: false
        livereload:
            enabled: false
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    base-url: ${APP_BASE_URL}

security:
    token:
        secret: ${JWT_SECRET}

evolution:
    api:
        token: ${EVOLUTION_TOKEN:}
        url: ${EVOLUTION_URL:}

logging:
    level:
        root: WARN
        com.rodizio_de_vagas: INFO

server:
    port: 8080
    servlet:
        context-path: /servico_extraordinario
